name: Build Tachyon Desktop

# Builds the Tachyon Windows installer and portable .exe straight from the repository checkout.
#
# Where the project may live (checked in this order, and it must be unambiguous):
#   1. the repository root            (package.json with  "name": "tachyon"  next to this .github folder)
#   2. exactly one sub-folder         (e.g. TachyonDesktop/package.json, one level down)
#   3. exactly one ZIP in the repository root (a source ZIP that contains the project) - unpacked automatically
# Anything else (no project, several projects, several ZIPs) stops the build with a clear message.
#
# Installers are NOT code-signed: Windows SmartScreen / macOS Gatekeeper will warn on first start.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read            # least privilege: this workflow only reads the repository

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'        # Electron 44 needs Node >= 22.12 (package.json declares this in "engines")

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false      # one platform failing must not hide the others
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win
            expect: 'Tachyon-Setup-*.exe Tachyon-Portable-*.exe'
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # never try to find a signing certificate
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Locate the Tachyon project
        run: |
          set -eu
          is_project() {
            [ -f "$1/package.json" ] && [ -f "$1/package-lock.json" ] && grep -Eq '"name"[[:space:]]*:[[:space:]]*"tachyon"' "$1/package.json"
          }
          extract() {   # unzip exists on Linux/macOS runners, 7z on Windows runners
            if command -v unzip >/dev/null 2>&1; then unzip -q "$1" -d "$2"; else 7z x -y "-o$2" "$1" >/dev/null; fi
          }
          find_projects() {   # $1 = folder, $2 = max depth -> prints every folder that holds the project
            find "$1" -maxdepth "$2" -name package.json -not -path '*/node_modules/*' -not -path '*/.git/*' | while read -r f; do
              d=$(dirname "$f"); if is_project "$d"; then echo "$d"; fi
            done
          }
          count_lines() { printf '%s' "$1" | grep -c . || true; }

          DIR=""
          if is_project .; then
            DIR="."
          else
            FOUND=$(find_projects . 2)
            N=$(count_lines "$FOUND")
            if [ "$N" -gt 1 ]; then echo "::error::More than one Tachyon project was found; keep exactly one:"; echo "$FOUND"; exit 1; fi
            if [ "$N" -eq 1 ]; then DIR="$FOUND"; fi
          fi

          if [ -z "$DIR" ]; then
            ZIPS=$(find . -maxdepth 1 -type f -iname '*.zip' | sort)
            Z=$(count_lines "$ZIPS")
            if [ "$Z" -gt 1 ]; then echo "::error::Found $Z ZIP files in the repository root, so the input is ambiguous. Keep only one:"; echo "$ZIPS"; exit 1; fi
            if [ "$Z" -eq 0 ]; then
              echo "::error::Tachyon project not found. Put the extracted project (package.json, package-lock.json, src/, test/ ...) in the repository root or in a single sub-folder, or upload exactly one source ZIP to the root."
              ls -la; exit 1
            fi
            echo "Unpacking the only ZIP in the repository root: $ZIPS"
            mkdir -p .tachyon_src
            extract "$ZIPS" .tachyon_src
            FOUND=$(find_projects .tachyon_src 3)
            N=$(count_lines "$FOUND")
            if [ "$N" -ne 1 ]; then echo "::error::Expected exactly one Tachyon project inside $ZIPS but found $N."; exit 1; fi
            DIR="$FOUND"
          fi
          echo "Project directory: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      # "npm ci" installs exactly what package-lock.json says and fails when it and package.json disagree.
      # --ignore-scripts is deliberate: Electron has no install script and electron-builder downloads the Electron runtime it
      # packages itself; the only packages with install scripts are optional native modules Tachyon does not use.
      - name: Install dependencies (reproducible, from package-lock.json)
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci --ignore-scripts

      # A failing test fails the build: there is no continue-on-error here.
      - name: Run tests (connectors, agent layer, security checks, file tools ...)
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm test

      - name: Build installer (${{ matrix.name }})
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Verify the expected installers exist and stage them for upload
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eu
          ls -l dist
          mkdir -p "$GITHUB_WORKSPACE/staging"
          set -f                                   # patterns below are matched by ls, not expanded early by the shell
          for pattern in ${{ matrix.expect }}; do
            set +f
            FILE=$(ls dist/$pattern 2>/dev/null | head -n 1 || true)
            set -f
            if [ -z "$FILE" ]; then echo "::error::Expected installer dist/$pattern was not produced."; exit 1; fi
            SIZE=$(wc -c < "$FILE" | tr -d ' ')
            echo "OK: $FILE ($SIZE bytes)"
            if [ "$SIZE" -lt 20000000 ]; then echo "::error::$FILE is suspiciously small ($SIZE bytes)."; exit 1; fi
            cp "$FILE" "$GITHUB_WORKSPACE/staging/"
          done
          set +f
          # NSIS and portable builds must have different names (they used to share one and overwrite each other).
          if [ "${{ matrix.name }}" = "windows" ] && [ "$(ls "$GITHUB_WORKSPACE/staging" | wc -l | tr -d ' ')" -lt 2 ]; then
            echo "::error::Both the Windows installer and the portable build must be present."; exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: tachyon-${{ matrix.name }}
          path: staging/*
          if-no-files-found: error
          retention-days: 30

      # ---- extra artifacts, produced once (on the Linux leg) --------------------------------------------------
      - name: Package the source (no node_modules, no build output, no personal data)
        if: matrix.name == 'windows'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -eu
          7z a -tzip -bso0 "$GITHUB_WORKSPACE/Tachyon-Source.zip" . -xr'!node_modules' -xr'!dist' -xr'!.git' -xr'!*.nova-bak' -xr'!apikey.bin' -xr'!conversations.json' -xr'!*.log'
          ls -l "$GITHUB_WORKSPACE/Tachyon-Source.zip"

      - name: Upload source ZIP
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: Tachyon-Source
          path: Tachyon-Source.zip
          if-no-files-found: error

      - name: Upload this workflow file
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: build-desktop-workflow
          path: .github/workflows/build-desktop.yml
          if-no-files-found: error

      # Last on purpose: if the real app cannot start, this leg turns red - but the installers above are already uploaded.
      # It starts the real Electron app with a throw-away profile, loads the window and checks the main <-> window bridge and the
      # connector layer (see runSmokeTest in src/main.js). Nothing is launched on the runner. Success is a TACHYON_SMOKE_OK line.
      - name: Smoke test - launch the real app (Windows)
        if: matrix.name == 'windows'
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          TACHYON_SMOKE_TEST: '1'
          TACHYON_SMOKE_OUT: smoke-result.txt
        run: |
          set -u
          timeout 120 npx electron . --disable-gpu 2>&1 | tee smoke.log || true
          cat smoke-result.txt 2>/dev/null || true
          grep -q 'TACHYON_SMOKE_OK' smoke-result.txt 2>/dev/null || grep -q 'TACHYON_SMOKE_OK' smoke.log || { echo "::error::The app did not report TACHYON_SMOKE_OK. See the log above."; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "--- node/npm"; node -v; npm -v
          echo "--- dist"; ls -la dist 2>/dev/null || echo "(no dist folder)"
          echo "--- electron-builder debug"; cat dist/builder-debug.yml 2>/dev/null | head -80 || true
          echo "--- npm logs (tail)"; for f in ~/.npm/_logs/*.log; do [ -f "$f" ] && { echo "## $f"; tail -n 60 "$f"; }; done 2>/dev/null || true
